<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>לוח הזמנות סטודיו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C1F23;
    --paper:#EFEEE9;
    --card:#FFFFFF;
    --line:#DAD8D1;
    --muted:#6B6B66;
    --chuda:#C9542C;
    --chuda-soft:#F3DCCC;
    --community:#256D8A;
    --community-soft:#CFE3EA;
    --danger:#B23A34;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Heebo',sans-serif;}
  body{padding-bottom:76px;}
  h1,h2,h3{font-weight:800;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  .header{
    background:var(--ink);color:var(--paper);
    padding:16px 16px 14px;
    position:sticky;top:0;z-index:20;
  }
  .header-top{display:flex;justify-content:space-between;align-items:center;}
  .header-top h1{font-size:18px;letter-spacing:0.3px;}
  .header-sub{font-size:12px;color:#B9B7AF;margin-top:2px;}
  .icon-btn{
    background:transparent;border:1px solid #45484D;color:var(--paper);
    border-radius:8px;padding:6px 10px;font-size:13px;
  }
  .studio-toggle{
    display:flex;gap:8px;margin-top:14px;
  }
  .studio-toggle button{
    flex:1;padding:10px 6px;border-radius:9px;border:2px solid transparent;
    font-weight:700;font-size:14px;background:#2A2D31;color:#9C9A93;
    transition:all .15s;
  }
  .studio-toggle button.active-chuda{background:var(--chuda);color:#fff;border-color:var(--chuda);}
  .studio-toggle button.active-community{background:var(--community);color:#fff;border-color:var(--community);}

  .week-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;}
  .week-nav button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;font-size:16px;}
  .week-label{font-weight:700;font-size:14px;}

  .grid-wrap{overflow-x:auto;padding:8px 10px 20px;}
  table.grid{border-collapse:collapse;width:100%;min-width:640px;}
  table.grid th, table.grid td{border:1px solid var(--line);text-align:center;}
  table.grid th{
    background:var(--card);font-size:12px;font-weight:700;padding:8px 2px;position:sticky;top:0;
  }
  table.grid th.today{color:var(--chuda);}
  td.hour-label{background:var(--card);font-size:11px;color:var(--muted);white-space:nowrap;padding:0 6px;font-weight:500;width:56px;}
  td.cell{width:82px;height:44px;padding:0;background:var(--card);}
  td.cell .slot{
    width:100%;height:100%;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;
  }
  td.cell .slot.empty{color:var(--line);font-size:16px;}
  td.cell .slot.empty:active{background:#00000008;}

  .section-pad{padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}

  /* Report */
  .month-picker{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-picker input{
    flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:14px;background:var(--card);
  }
  table.report{width:100%;border-collapse:collapse;font-size:13px;}
  table.report th,table.report td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
  table.report th{color:var(--muted);font-weight:700;font-size:11px;}
  table.report td.name{text-align:right;font-weight:700;display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;}
  table.report tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;}
  .empty-state{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}

  /* Trainers */
  .trainer-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .trainer-row:last-child{border-bottom:none;}
  .trainer-row input[type=text]{
    flex:2;border:none;background:transparent;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);padding:4px 0;
  }
  .rate-wrap{display:flex;align-items:center;gap:4px;flex:1;}
  .rate-wrap input{
    width:56px;border:1px solid var(--line);border-radius:6px;padding:6px;font-family:inherit;font-size:13px;text-align:center;
  }
  .rate-wrap span{font-size:11px;color:var(--muted);}
  .del-btn{background:none;border:none;color:var(--danger);font-size:18px;padding:4px 6px;}
  .add-trainer{display:flex;gap:8px;margin-top:12px;}
  .add-trainer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;}
  .add-trainer button{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:0 16px;font-weight:700;}

  .backup-row{display:flex;gap:8px;}
  .backup-row button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;font-weight:600;}
  input[type=file]{display:none;}

  /* Bottom nav */
  .bottom-nav{
    position:fixed;bottom:0;right:0;left:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav button{
    flex:1;background:none;border:none;padding:11px 4px 9px;font-size:11px;
    color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .bottom-nav button .ic{font-size:19px;}
  .bottom-nav button.active{color:var(--ink);}
  .bottom-nav button.active .ic{transform:scale(1.05);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:#00000066;z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card);width:100%;max-width:480px;border-radius:16px 16px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font-size:15px;margin-bottom:2px;}
  .sheet .sheet-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .trainer-pick{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
  }
  .trainer-pick button{
    padding:12px 4px;border-radius:9px;border:2px solid var(--line);background:var(--card);
    font-weight:700;font-size:13px;color:var(--ink);
  }
  .sheet-actions{display:flex;gap:8px;}
  .sheet-actions button{flex:1;padding:12px;border-radius:9px;border:none;font-weight:700;font-size:14px;}
  .btn-clear{background:#F3E6E5;color:var(--danger);}
  .btn-cancel{background:var(--paper);color:var(--ink);}

  .toast{
    position:fixed;bottom:90px;right:50%;transform:translateX(50%);
    background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;
    z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>לוח הזמנות סטודיו</h1>
      <div class="header-sub" id="headerSub">מעקב מאמנים ותשלומים</div>
    </div>
    <button class="icon-btn" onclick="openBackup()">⚙ גיבוי</button>
  </div>
  <div class="studio-toggle">
    <button id="btnChuda" onclick="setStudio('chuda')">Chuda</button>
    <button id="btnCommunity" onclick="setStudio('community')">Community</button>
  </div>
</div>

<div id="viewGrid">
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="weekLabel"></div>
    <button onclick="changeWeek(1)">›</button>
  </div>
  <div class="grid-wrap">
    <table class="grid" id="gridTable"></table>
  </div>
</div>

<div id="viewReport" style="display:none" class="section-pad">
  <div class="month-picker">
    <button class="icon-btn" style="color:var(--ink);border-color:var(--line)" onclick="changeMonth(-1)">‹</button>
    <input type="month" id="monthInput" onchange="onMonthInputChange()">
    <button class="icon-btn" style="color:var(--ink);border-color:var(--line)" onclick="changeMonth(1)">›</button>
  </div>
  <div class="card">
    <div id="reportContent"></div>
  </div>
</div>

<div id="viewTrainers" style="display:none" class="section-pad">
  <div class="card">
    <h3 style="margin-bottom:8px;">מאמנים</h3>
    <div id="trainersList"></div>
    <div class="add-trainer">
      <input type="text" id="newTrainerName" placeholder="שם מאמן חדש">
      <button onclick="addTrainer()">הוסף</button>
    </div>
  </div>
  <div class="card" style="font-size:12px;color:var(--muted);line-height:1.6;">
    💡 תעריף הוא מחיר לשעה (₪). שנה אותו בכל עת — הדוח החודשי מחשב לפי התעריף העדכני בזמן ההצגה.
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" data-view="grid" onclick="switchView('grid')"><span class="ic">🗓️</span>לוח שבועי</button>
  <button class="nav-btn" data-view="report" onclick="switchView('report')"><span class="ic">📊</span>דוח חודשי</button>
  <button class="nav-btn" data-view="trainers" onclick="switchView('trainers')"><span class="ic">👥</span>מאמנים</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <h3 id="sheetTitle"></h3>
    <div class="sheet-sub" id="sheetSub"></div>
    <div class="trainer-pick" id="trainerPick"></div>
    <div class="sheet-actions">
      <button class="btn-clear" id="btnClearSlot" onclick="clearSlot()" style="display:none">נקה הזמנה</button>
      <button class="btn-cancel" onclick="closeSheet()">ביטול</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" onchange="importData(event)">
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='studio_scheduler_v1';
const HOURS=[]; for(let h=6;h<=20;h++) HOURS.push(h);
const DAY_NAMES=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const PALETTE=['#C9542C','#256D8A','#8A6D3B','#5B7B3E','#7A4C7E','#B23A34','#3E7C7B','#A67C2E','#4A5A8A','#8A3E5C','#5E6B23','#2E5C8A'];

let data = loadData();
let studio = 'chuda';
let currentWeekStart = getWeekStart(new Date());
let currentView = 'grid';
let pendingCell = null; // {date, hour}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const names=['ליה','רועי','שיר','שחף','נורית','אור','שקד','מאיה'];
  return {
    trainers: names.map((n,i)=>({id:'t'+i, name:n, rate:0, color:PALETTE[i%PALETTE.length]})),
    bookings: []
  };
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

/* ---------- date helpers ---------- */
function getWeekStart(d){
  const nd = new Date(d); nd.setHours(0,0,0,0);
  nd.setDate(nd.getDate()-nd.getDay());
  return nd;
}
function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtShort(d){ return d.getDate()+'/'+(d.getMonth()+1); }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function isSameDate(a,b){ return fmtISO(a)===fmtISO(b); }

/* ---------- studio toggle ---------- */
function setStudio(s){
  studio = s;
  document.getElementById('btnChuda').className = s==='chuda'?'active-chuda':'';
  document.getElementById('btnCommunity').className = s==='community'?'active-community':'';
  renderGrid();
}

/* ---------- view switching ---------- */
function switchView(v){
  currentView = v;
  document.getElementById('viewGrid').style.display = v==='grid'?'':'none';
  document.getElementById('viewReport').style.display = v==='report'?'':'none';
  document.getElementById('viewTrainers').style.display = v==='trainers'?'':'none';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('headerSub').textContent =
    v==='grid' ? 'מעקב מאמנים ותשלומים' : v==='report' ? 'סיכום שעות ותשלום חודשי' : 'ניהול רשימת המאמנים';
  if(v==='report') renderReport();
  if(v==='trainers') renderTrainers();
}

/* ---------- weekly grid ---------- */
function changeWeek(dir){
  currentWeekStart = addDays(currentWeekStart, dir*7);
  renderGrid();
}
function renderGrid(){
  const days=[]; for(let i=0;i<7;i++) days.push(addDays(currentWeekStart,i));
  const label = fmtShort(days[0])+' – '+fmtShort(days[6])+'  '+days[0].getFullYear();
  document.getElementById('weekLabel').textContent = label;

  const today = new Date();
  let html = '<thead><tr><th></th>';
  days.forEach(d=>{
    html += `<th class="${isSameDate(d,today)?'today':''}">${DAY_NAMES[d.getDay()]}<br>${fmtShort(d)}</th>`;
  });
  html += '</tr></thead><tbody>';

  HOURS.forEach(h=>{
    html += `<tr><td class="hour-label">${String(h).padStart(2,'0')}:00–${String(h+1).padStart(2,'0')}:00</td>`;
    days.forEach(d=>{
      const iso = fmtISO(d);
      const booking = data.bookings.find(b=>b.date===iso && b.hour===h && b.studio===studio);
      if(booking){
        const tr = data.trainers.find(t=>t.id===booking.trainerId);
        const name = tr ? tr.name : '?';
        const color = tr ? tr.color : '#999';
        html += `<td class="cell"><button class="slot" style="background:${color}" onclick="openSlot('${iso}',${h})">${name}</button></td>`;
      } else {
        html += `<td class="cell"><button class="slot empty" onclick="openSlot('${iso}',${h})">+</button></td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody>';
  document.getElementById('gridTable').innerHTML = html;
}

function openSlot(iso, hour){
  pendingCell = {date:iso, hour};
  const d = new Date(iso+'T00:00:00');
  const existing = data.bookings.find(b=>b.date===iso && b.hour===hour && b.studio===studio);
  document.getElementById('sheetTitle').textContent = `${studio==='chuda'?'Chuda':'Community'} · ${DAY_NAMES[d.getDay()]} ${fmtShort(d)}`;
  document.getElementById('sheetSub').textContent = `${String(hour).padStart(2,'0')}:00–${String(hour+1).padStart(2,'0')}:00`;

  const pickWrap = document.getElementById('trainerPick');
  pickWrap.innerHTML = data.trainers.map(t=>
    `<button style="border-color:${t.color};${existing&&existing.trainerId===t.id?`background:${t.color};color:#fff;`:''}" onclick="assignTrainer('${t.id}')">${t.name}</button>`
  ).join('');
  if(data.trainers.length===0){
    pickWrap.innerHTML = '<div style="grid-column:1/-1;color:var(--muted);font-size:13px;">אין מאמנים עדיין. הוסף מהלשונית "מאמנים".</div>';
  }
  document.getElementById('btnClearSlot').style.display = existing ? '' : 'none';
  document.getElementById('overlay').classList.add('show');
}
function assignTrainer(trainerId){
  const {date,hour} = pendingCell;
  data.bookings = data.bookings.filter(b=>!(b.date===date && b.hour===hour && b.studio===studio));
  data.bookings.push({id:Date.now()+'', date, hour, studio, trainerId});
  saveData(); closeSheet(); renderGrid();
}
function clearSlot(){
  const {date,hour} = pendingCell;
  data.bookings = data.bookings.filter(b=>!(b.date===date && b.hour===hour && b.studio===studio));
  saveData(); closeSheet(); renderGrid();
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); pendingCell=null; }

/* ---------- monthly report ---------- */
let reportMonth = new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
function onMonthInputChange(){ reportMonth = document.getElementById('monthInput').value; renderReport(); }
function changeMonth(dir){
  const [y,m] = reportMonth.split('-').map(Number);
  const nd = new Date(y, m-1+dir, 1);
  reportMonth = nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');
  renderReport();
}
function renderReport(){
  document.getElementById('monthInput').value = reportMonth;
  const [y,m] = reportMonth.split('-').map(Number);
  const monthBookings = data.bookings.filter(b=>{
    const [by,bm] = b.date.split('-').map(Number);
    return by===y && bm===m;
  });

  if(data.trainers.length===0){
    document.getElementById('reportContent').innerHTML = '<div class="empty-state">אין מאמנים ברשימה עדיין</div>';
    return;
  }

  let grandHours=0, grandPay=0;
  const rows = data.trainers.map(t=>{
    const chudaH = monthBookings.filter(b=>b.trainerId===t.id && b.studio==='chuda').length;
    const commH = monthBookings.filter(b=>b.trainerId===t.id && b.studio==='community').length;
    const total = chudaH+commH;
    const pay = total * (Number(t.rate)||0);
    grandHours += total; grandPay += pay;
    return {t, chudaH, commH, total, pay};
  }).filter(r=>r.total>0 || true); // show all trainers even with 0

  if(rows.every(r=>r.total===0)){
    document.getElementById('reportContent').innerHTML = '<div class="empty-state">אין הזמנות בחודש זה</div>';
    return;
  }

  let html = `<table class="report"><thead><tr>
    <th style="text-align:right">מאמן</th><th>Chuda</th><th>Community</th><th>סה"כ שעות</th><th>תעריף</th><th>לתשלום</th>
  </tr></thead><tbody>`;
  rows.sort((a,b)=>b.total-a.total).forEach(r=>{
    html += `<tr>
      <td class="name"><span class="dot" style="background:${r.t.color}"></span>${r.t.name}</td>
      <td>${r.chudaH}</td>
      <td>${r.commH}</td>
      <td><b>${r.total}</b></td>
      <td>₪${r.t.rate||0}</td>
      <td><b>₪${r.pay.toLocaleString()}</b></td>
    </tr>`;
  });
  html += `</tbody><tfoot><tr>
    <td colspan="3">סה"כ</td><td>${grandHours}</td><td></td><td>₪${grandPay.toLocaleString()}</td>
  </tr></tfoot></table>`;
  document.getElementById('reportContent').innerHTML = html;
}

/* ---------- trainers management ---------- */
function renderTrainers(){
  const wrap = document.getElementById('trainersList');
  if(data.trainers.length===0){
    wrap.innerHTML = '<div class="empty-state">אין מאמנים עדיין — הוסף למטה</div>';
    return;
  }
  wrap.innerHTML = data.trainers.map(t=>`
    <div class="trainer-row">
      <span class="dot" style="background:${t.color}"></span>
      <input type="text" value="${t.name}" onchange="renameTrainer('${t.id}', this.value)">
      <div class="rate-wrap">
        <input type="number" value="${t.rate}" onchange="setRate('${t.id}', this.value)">
        <span>₪/שעה</span>
      </div>
      <button class="del-btn" onclick="deleteTrainer('${t.id}')">✕</button>
    </div>
  `).join('');
}
function renameTrainer(id, name){
  const t = data.trainers.find(x=>x.id===id); if(t){ t.name = name.trim()||t.name; saveData(); }
}
function setRate(id, rate){
  const t = data.trainers.find(x=>x.id===id); if(t){ t.rate = Number(rate)||0; saveData(); }
}
function deleteTrainer(id){
  const t = data.trainers.find(x=>x.id===id);
  if(!t) return;
  const hasBookings = data.bookings.some(b=>b.trainerId===id);
  if(hasBookings && !confirm(`ל${t.name} יש הזמנות קיימות. מחיקה תסיר גם את ההזמנות שלו. להמשיך?`)) return;
  data.trainers = data.trainers.filter(x=>x.id!==id);
  data.bookings = data.bookings.filter(b=>b.trainerId!==id);
  saveData(); renderTrainers();
}
function addTrainer(){
  const input = document.getElementById('newTrainerName');
  const name = input.value.trim();
  if(!name){ return; }
  const color = PALETTE[data.trainers.length % PALETTE.length];
  data.trainers.push({id:'t'+Date.now(), name, rate:0, color});
  input.value='';
  saveData(); renderTrainers();
  showToast('המאמן נוסף');
}

/* ---------- backup ---------- */
function openBackup(){
  const choice = confirm('לייצא גיבוי JSON? (ביטול = ייבוא גיבוי)');
  if(choice){ exportData(); } else { document.getElementById('importFile').click(); }
}
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'studio-scheduler-backup-'+fmtISO(new Date())+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('הגיבוי הורד');
}
function importData(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.trainers || !parsed.bookings) throw new Error('bad format');
      data = parsed; saveData();
      renderGrid(); renderReport(); renderTrainers();
      showToast('הגיבוי יובא בהצלחה');
    }catch(err){ alert('קובץ לא תקין'); }
  };
  reader.readAsText(file);
  event.target.value='';
}

/* ---------- init ---------- */
setStudio('chuda');
renderGrid();
document.getElementById('monthInput').value = reportMonth;
</script>
