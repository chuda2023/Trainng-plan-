<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="לוח אימון">
<title>לוח אימון קבוצתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600&display=swap">
<style>
/* Layout: tablet-first training board — warm linen ground, deep lagoon-teal accent, six soft trainee colours for the live bubbles */
:root{
  --bg:#F5F2EE; --surface:#FBFAF8; --raise:#FFFFFF; --ink:#1F2A2C; --muted:#5A6668; --line:#E3DED7;
  --accent:#17736C; --accent-ink:#FFFFFF; --accent-soft:#D5EDEA;
  --gold:#94681C; --gold-soft:#FCEFD3; --danger:#B0442E; --danger-soft:#FBE3DC;
  --scrim:rgba(24,34,36,.45);
  --t1b:#FFE1D6; --t1i:#A1381C; --t2b:#D3F0EB; --t2i:#14675F; --t3b:#FFF0C2; --t3i:#835A00;
  --t4b:#E6E1FB; --t4i:#4B3A9E; --t5b:#D9E9FB; --t5i:#22568F; --t6b:#FBDCE7; --t6i:#962B57;
  --f-display:"Heebo","Rubik","Segoe UI",Arial,sans-serif;
  --f-body:"Heebo","Segoe UI",Arial,sans-serif;
  --f-num:"Rubik","Heebo",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A1B; --surface:#1A2223; --raise:#212B2C; --ink:#F2F0EC; --muted:#A9B4B3; --line:#33403F;
  --accent:#6FCFC4; --accent-ink:#0B201E; --accent-soft:#1D3836;
  --gold:#E6C27A; --gold-soft:#372D1A; --danger:#EE9A86; --danger-soft:#3F2620;
  --scrim:rgba(0,0,0,.6);
  --t1b:#43271F; --t1i:#FFBFA8; --t2b:#173B37; --t2i:#93E2D7; --t3b:#3D3214; --t3i:#F6D27A;
  --t4b:#2E2849; --t4i:#C9BEFA; --t5b:#1C3049; --t5i:#A9CDF6; --t6b:#43222F; --t6i:#F6B1CB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A1B; --surface:#1A2223; --raise:#212B2C; --ink:#F2F0EC; --muted:#A9B4B3; --line:#33403F;
  --accent:#6FCFC4; --accent-ink:#0B201E; --accent-soft:#1D3836;
  --gold:#E6C27A; --gold-soft:#372D1A; --danger:#EE9A86; --danger-soft:#3F2620;
  --scrim:rgba(0,0,0,.6);
  --t1b:#43271F; --t1i:#FFBFA8; --t2b:#173B37; --t2i:#93E2D7; --t3b:#3D3214; --t3i:#F6D27A;
  --t4b:#2E2849; --t4i:#C9BEFA; --t5b:#1C3049; --t5i:#A9CDF6; --t6b:#43222F; --t6i:#F6B1CB; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:19px;font-weight:500;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}

.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:18px 150px}
.wrap.narrow{max-width:760px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:6px 20px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tl,.tr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eyebrow{font:700 13px var(--f-body);letter-spacing:.2em;color:var(--muted)}
.eyebrow.live{color:var(--accent);letter-spacing:.08em;font-size:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 clamp(30px,4vw,42px)/1.15 var(--f-display)}
h2{font:700 28px/1.2 var(--f-display)}
h3{font:700 20px var(--f-body)}
.sec{margin:36px 0 12px;font:600 14px var(--f-body);letter-spacing:.12em;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.big{min-height:68px;padding:0 34px;font-size:21px}
.btn.sm{min-height:44px;padding:0 18px;font-size:16px}
.btn.wide{width:100%}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}

.inp{min-height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--raise);font-size:18px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.ta{width:100%;min-height:120px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--raise);font:14px/1.4 var(--f-num);direction:ltr;resize:vertical}

/* dock */
.dock{position:fixed;inset-inline:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,36px);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.dock .muted{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* home */
.hero,.activebox{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:36px;border-radius:24px;background:var(--raise);border:1px solid var(--line)}
.hero p{margin:8px 0 0;max-width:46ch}
.activebox{border-color:var(--accent)}
.ab-t{font:700 28px var(--f-display);margin-top:4px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;margin-top:18px}
.navi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:start;font-weight:600}
.navi .nk{font:700 40px/1 var(--f-num);color:var(--accent)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:18px;padding:16px 4px;border-bottom:1px solid var(--line)}
button.row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.row .nm{font-weight:600;font-size:20px}
.empty{color:var(--muted);padding:18px 0}
.empty-box{padding:40px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;display:grid;gap:14px;justify-items:center}
.empty-box p{margin:0}

/* toolbar / tiles */
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:20px}
.addrow{display:flex;gap:10px}
.counter{font-size:22px;padding:8px 18px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.tile{position:relative;min-height:92px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:22px;transition:background .15s}
.tile.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{position:absolute;top:8px;inset-inline-start:10px;font-size:14px;opacity:.85}

/* plan */
.ttabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px}
.ttab{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:19px;white-space:nowrap}
.ttab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ttab .cnt{font-size:14px;min-width:26px;height:26px;display:grid;place-items:center;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.ttab.miss .cnt{background:var(--danger-soft);color:var(--danger)}
.plan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:28px;align-items:start}
.pcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:24px;border-radius:20px;background:var(--raise);border:1px solid var(--line);display:grid;gap:16px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--surface)}
.idx{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:15px}
.lcol{display:grid;gap:14px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:16px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.gh{margin:14px 0 8px;font:600 13px var(--f-body);letter-spacing:.12em;color:var(--muted)}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.exb{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:start;font-size:17px}
.exb .ck{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:99px;border:1px solid var(--line);font-size:15px;color:var(--muted)}
.exb.on{border-color:var(--accent);background:var(--accent-soft)}
.exb.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* live board */
.c0{--cb:var(--t1b);--ci:var(--t1i)}.c1{--cb:var(--t2b);--ci:var(--t2i)}.c2{--cb:var(--t3b);--ci:var(--t3i)}
.c3{--cb:var(--t4b);--ci:var(--t4i)}.c4{--cb:var(--t5b);--ci:var(--t5i)}.c5{--cb:var(--t6b);--ci:var(--t6i)}
.livewrap{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;padding-inline:clamp(16px,2.4vw,28px);padding-block:14px 18px}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ltop .tl{gap:18px}
.ltitle{font:800 26px var(--f-display)}
.lhint{font-size:19px;color:var(--muted)}
.clock{font-size:19px;color:var(--muted);padding:8px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.bubbles{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(190px,1fr);gap:clamp(12px,1.6vw,20px)}
.bubbles.n1{grid-template-columns:minmax(0,1fr)}
.bubbles.n2,.bubbles.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.bub{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-width:0;padding:clamp(20px,2.6vw,34px);border-radius:40px;border:2px solid transparent;background:var(--cb);color:var(--ci);text-align:start;overflow:hidden;transition:transform .12s,border-color .15s,box-shadow .15s}
.bub:hover{border-color:var(--ci)}
.bub:active{transform:scale(.98)}
.bub .bnm{font:800 clamp(38px,5.2vw,70px)/1.05 var(--f-display);overflow-wrap:anywhere}
.bub .bnow{font-size:clamp(18px,1.9vw,24px);font-weight:600;color:var(--ink);opacity:.85}
.bub .bnow b{font-weight:700;color:var(--ci)}
.bub .bfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:19px;font-weight:600}
.bub .bsets{font:600 clamp(30px,3vw,40px)/1 var(--f-num)}
.bub .bar{background:var(--raise);height:10px;opacity:.95}
.bub .bar i{background:var(--ci)}
.bub.done::after{content:"✓";position:absolute;top:22px;inset-inline-end:26px;width:46px;height:46px;display:grid;place-items:center;border-radius:99px;background:var(--ci);color:var(--cb);font-size:24px;font-weight:800}
@media (orientation:portrait) and (min-width:600px){
  .bubbles.n3,.bubbles.n5,.bubbles.n6{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:599px){
  .bubbles,.bubbles.n2,.bubbles.n4{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(150px,auto)}
  .bub{border-radius:28px}
}
/* import */
.steps{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.filebtn{min-height:76px;font-size:21px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.impt{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.err{padding:16px 18px;border-radius:14px;background:var(--danger-soft);color:var(--danger);font-weight:600}
.okbox{padding:16px 18px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.navi.imp{border-color:var(--accent);background:var(--accent-soft)}
.navi.imp .nk{font-size:30px}
.bar{display:block;height:6px;border-radius:9px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

/* entry */
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.ebar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,3vw,36px)}
.backb{min-height:64px;padding:0 26px;font-size:20px;flex:none}
.backb .ar{font-size:24px}
.sw{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.sw::-webkit-scrollbar{display:none}
.swp{display:flex;align-items:center;gap:10px;flex:none;min-height:64px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:19px;white-space:nowrap}
.swp .swn{min-width:28px;height:28px;display:grid;place-items:center;border-radius:99px;background:var(--surface);color:var(--muted);font-size:14px}
.swp::before{content:"";width:12px;height:12px;border-radius:99px;background:var(--ci);flex:none}
.swp.on{background:var(--cb);color:var(--ci);border-color:var(--ci);border-width:2px;cursor:default}
.swp.on .swn{background:var(--ci);color:var(--cb)}
.entryc .ename{color:var(--ci)}
.entryc .ex.open{border-color:var(--ci)}
.entryc .btn.pri.log{background:var(--ci);border-color:var(--ci);color:var(--cb)}
.entryc .ex.open .idx{background:var(--cb);color:var(--ci)}
.edock{justify-content:center}
.edock .btn{max-width:720px;background:var(--raise)}
.etop{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ename{font:800 clamp(40px,6vw,60px)/1.1 var(--f-display)}
.exlist{display:grid;gap:12px}
.ex{border-radius:22px;border:1px solid var(--line);background:var(--raise);overflow:hidden}
.ex.open{border-color:var(--accent)}
.exh{width:100%;display:flex;align-items:center;gap:14px;min-height:76px;padding:0 24px;background:none;border:0;text-align:start}
.exn{font-size:25px;font-weight:700}
.ok{color:var(--accent);font-size:22px}
.ex.done:not(.open) .exn{color:var(--muted)}
.exb2{display:grid;gap:20px;padding:4px 24px 26px}
.prev{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:14px 18px;border-radius:14px;background:var(--surface);font-size:19px}
.prev .lbl{font-size:15px;color:var(--muted);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 18px 0 8px;border-radius:14px;border:1px solid transparent;background:var(--accent-soft);color:var(--ink);font-size:19px}
.set .sn{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--raise);font:500 15px var(--f-num);color:var(--accent)}
.set.arm{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stp-l{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:8px}
.stp{display:grid;grid-template-columns:84px minmax(0,1fr) 84px;border-radius:18px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.stp button{height:100px;border:0;background:transparent;font:500 22px var(--f-num)}
.stp button:active{background:var(--accent-soft)}
.stp .val{font:600 54px var(--f-num);background:var(--raise);border-inline:1px solid var(--line)}
.log{min-height:86px;font-size:26px;border-radius:20px;width:100%}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-bottom:26px}
.stat{padding:18px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font:600 34px/1.15 var(--f-num)}
.stat span{font-size:15px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.pc{padding:22px;border-radius:20px;background:var(--raise);border:1px solid var(--line);display:grid;gap:10px;min-width:0}
.pch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pch h3{font-size:19px}
.pill{flex:none;font:500 14px var(--f-num);padding:5px 12px;border-radius:99px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.up{background:var(--accent-soft);color:var(--accent)}
.pill.down{background:var(--danger-soft);color:var(--danger)}
.pcs{display:flex;align-items:baseline;gap:8px}
.pcs .big{font-size:38px;font-weight:600}
.small{font-size:15px}
.nochart{padding:22px 0;color:var(--muted);font-size:15px}
svg.ch{width:100%;height:auto;display:block;direction:ltr}
.ch-area{fill:var(--accent-soft)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ch-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.ch-t{fill:var(--muted);font:12px var(--f-num)}
.ch-dot{fill:var(--raise);stroke:var(--accent);stroke-width:2}
.ch-end{fill:var(--accent)}
.ch-pr{fill:var(--gold)}
.edit{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.edit .inp{flex:1 1 220px;width:auto}

/* library & data */
.addex{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;margin-bottom:20px}
.lrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 6px;border-bottom:1px solid var(--line)}
.lrow .btn{min-height:40px;font-size:15px;padding:0 14px}
.panel{display:grid;gap:12px;padding:24px;border-radius:20px;background:var(--raise);border:1px solid var(--line);margin-bottom:16px}
.panel p{margin:0}
.tnote{padding:12px 16px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:17px;line-height:1.45}
.pnote{flex-basis:100%;font-size:16px;color:var(--muted)}
.pnote::before{content:"✎ "}
.tna{width:100%;min-height:110px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--raise);font:500 18px/1.5 var(--f-body);resize:vertical}
.row2{display:flex;gap:10px;flex-wrap:wrap}

/* keypad */
#kp{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:var(--scrim)}
#kp[hidden]{display:none}
.kpbox{width:min(400px,100%);padding:24px;border-radius:26px;background:var(--raise);display:grid;gap:16px}
.kpl{font-weight:600;color:var(--muted);text-align:center}
.kpv{font:600 56px/1.1 var(--f-num);text-align:center;padding:10px;border-radius:16px;background:var(--surface)}
.kpv .ph{color:var(--line)}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.kpg button{height:72px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font:500 28px var(--f-num)}
.kpg button:active{background:var(--accent-soft)}
.kpa{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);padding:16px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:18px;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.gold{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}

@media (max-width:820px){
  .plan{grid-template-columns:minmax(0,1fr)}
  .pcol{position:static}
  .toolbar{grid-template-columns:minmax(0,1fr)}
  .addex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  body{font-size:17px}
  .steppers{grid-template-columns:minmax(0,1fr)}
  .stp{grid-template-columns:70px minmax(0,1fr) 70px}
  .stp button{height:84px}
  .hero,.activebox{padding:24px}
  .dock .muted{display:none}
  .dock .btn{flex:1}
  .exh{padding:0 16px}.exb2{padding:4px 16px 20px}
  .backb{padding:0 16px;font-size:17px}
  .swp{padding:0 14px;font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function seedEx(){const a=[];GROUPS.forEach(g=>(SEED[g]||[]).forEach(n=>a.push({id:'x'+(a.length+1),name:n,g})));return a;}
function blank(){return {v:1,trainees:[],exercises:seedEx(),sessions:[],active:null};}

const tname=id=>{const t=T(id);return t?t.name:'מתאמן שנמחק';};

const hm=t=>{const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');};
const elapsed=t=>{const m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<60?m+' דק׳':Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' שע׳';};

function sessionsOf(tid){return db.sessions.filter(s=>s.ts.some(x=>x.tid===tid)).sort((a,b)=>b.date-a.date);}
function entryOf(s,tid){return s.ts.find(x=>x.tid===tid);}
function lastSets(tid,eid){for(const s of sessionsOf(tid)){const l=entryOf(s,tid).log[eid];if(l&&l.length)return {date:s.date,sets:l};}return null;}
function history(tid,eid){const out=[];sessionsOf(tid).slice().reverse().forEach(s=>{const l=entryOf(s,tid).log[eid];if(l&&l.length)out.push({date:s.date,w:Math.max(...l.map(z=>z.w)),r:Math.max(...l.map(z=>z.r))});});return out;}
function fixedPlan(tid){const t=T(tid);return t&&Array.isArray(t.plan)?t.plan.filter(id=>E(id)&&!E(id).hidden):[];}
function lastPlan(tid){const s=sessionsOf(tid)[0];return s?entryOf(s,tid).ex.filter(id=>E(id)&&!E(id).hidden):[];}

let ui={view:'home',sel:[],pi:0,plan:{},editing:false,cur:null,open:null,grp:'הכל',q:'',confirm:null,draft:{}};
let armT=null,toastT=null,idleT=null,wl=null,kp=null;

function toast(m,kind){toastEl.textContent=m;toastEl.className='show'+(kind?' '+kind:'');clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.className='';},kind==='gold'?3200:2400);}
function arm(key){if(ui.confirm===key){ui.confirm=null;clearTimeout(armT);return true;}ui.confirm=key;clearTimeout(armT);armT=setTimeout(()=>{ui.confirm=null;render();},4000);render();return false;}
function go(v){ui.view=v;ui.q='';ui.confirm=null;closeKp();window.scrollTo(0,0);render();if(v==='live'||v==='entry')wake();bumpIdle();}
async function wake(){try{if(db.active&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(ui.view==='live'||ui.view==='entry'))wake();});
function bumpIdle(){clearTimeout(idleT);if(ui.view==='entry')idleT=setTimeout(()=>{if(ui.view==='entry'){go('live');}},90000);}
document.addEventListener('pointerdown',bumpIdle,{passive:true});

function top(title,back,extra){

}

function dkey(tid,eid){return tid+'|'+eid;}
function draft(x,eid){
  const k=dkey(x.tid,eid);if(ui.draft[k])return ui.draft[k];
  const today=x.log[eid]||[];const prev=lastSets(x.tid,eid);const n=today.length;
  const lt=today[n-1];const pv=prev?(prev.sets[n]||prev.sets[prev.sets.length-1]):null;
  const d={w:lt?lt.w:(pv?pv.w:0),r:(lt&&lt.r)?lt.r:((pv&&pv.r)?pv.r:10)};
  if(lt&&pv&&prev.sets[n]&&prev.sets[n].r){d.r=prev.sets[n].r;}
  return ui.draft[k]=d;
}
function stepper(label,f,val,plus,minus){
  return `<div><div class="stp-l">${label}</div><div class="stp"><button data-a="step" data-v="${f}|1" aria-label="הוספה"><span dir="ltr">${plus}</span></button><button class="val num" data-a="kp" data-v="${f}" aria-label="הקלדת ערך">${val}</button><button data-a="step" data-v="${f}|-1" aria-label="הפחתה"><span dir="ltr">${minus}</span></button></div></div>`;
}
function exBlock(x,eid,i){
  const today=x.log[eid]||[];const open=ui.open===eid;
  const head=`<button class="exh" data-a="openEx" data-v="${eid}" aria-expanded="${open}"><span class="idx num">${i+1}</span><span class="grow exn">${esc(ename(eid))}</span>${today.length?`<span class="muted"><span class="num">${today.length}</span> סטים</span>`:''}${today.length&&!open?'<span class="ok">✓</span>':''}</button>`;
  if(!open)return `<article class="ex ${today.length?'done':''}">${head}</article>`;
  const prev=lastSets(x.tid,eid);const d=draft(x,eid);
  const next=x.ex[i+1];
  return `<article class="ex open">${head}<div class="exb2">
    <div class="prev">${prev?`<span class="lbl">פעם קודמת · <span class="num">${dm(prev.date)}</span></span><span class="num" dir="ltr">${prev.sets.map(s=>fmt(s.w)+(s.r?'×'+s.r:' ק״ג')).join('   ·   ')}</span>${prev.sets.filter(s=>s.n).map(s=>`<span class="pnote">${esc(s.n)}</span>`).join('')}`:'<span class="lbl">פעם ראשונה בתרגיל הזה</span>'}</div>
    ${today.length?`<div class="sets">${today.map((s,k)=>{const key='del:'+eid+':'+k;return `<button class="set ${ui.confirm===key?'arm':''}" data-a="delSet" data-v="${eid}|${k}"><span class="sn">${k+1}</span><span class="num">${ui.confirm===key?'למחוק את הסט?':fmt(s.w)+' ק״ג × '+s.r}</span></button>`;}).join('')}</div>`:''}
    <div class="steppers">${stepper('משקל (ק״ג)','w',fmt(d.w),'+2.5','−2.5')}${stepper('חזרות','r',d.r,'+1','−1')}</div>
    <button class="btn pri log" data-a="log" data-v="${eid}">רישום סט ${today.length+1}</button>
    ${next?`<button class="btn ghost wide" data-a="openEx" data-v="${next}">לתרגיל הבא: ${esc(ename(next))} ←</button>`:`<button class="btn ghost wide" data-a="go" data-v="live">סיימתי · חזרה ללוח</button>`}
  </div></article>`;
}

V.roster=()=>`<div class="wrap">${top('מתאמנים','home')}
  <div class="toolbar"><input id="q" class="inp" placeholder="חיפוש מתאמן" value="${esc(ui.q)}" autocomplete="off"><div class="addrow"><input id="newT" class="inp" placeholder="שם מתאמן חדש" autocomplete="off"><button class="btn" data-a="addTrainee">הוספה</button></div></div>

function chart(h,m){
  if(h.length<2)return `<div class="nochart">המגמה תופיע אחרי האימון השני בתרגיל הזה.</div>`;
  const W=320,H=120,pl=36,pr=14,pt=14,pb=24;
  const ys=h.map(p=>p[m]);const lo=Math.min(...ys),hi=Math.max(...ys);
  let mn=lo,mx=hi;if(mn===mx){mn-=2.5;mx+=2.5;}const pad=(mx-mn)*.18;mn=Math.max(0,mn-pad);mx+=pad;
  const x=i=>pl+(W-pl-pr)*(i/(h.length-1));const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const pts=h.map((p,i)=>[x(i),y(p[m])]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  const last=h[h.length-1][m];const isPr=last===hi&&h.length>1&&hi>lo;
  let g=`<line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${y(hi)}" y2="${y(hi)}"/><text class="ch-t" x="${pl-6}" y="${y(hi)+4}" text-anchor="end">${fmt(hi)}</text>`;
  if(hi!==lo)g+=`<line class="ch-grid" x1="${pl}" x2="${W-pr}" y1="${y(lo)}" y2="${y(lo)}"/><text class="ch-t" x="${pl-6}" y="${y(lo)+4}" text-anchor="end">${fmt(lo)}</text>`;
  g+=`<text class="ch-t" x="${pl}" y="${H-6}" text-anchor="start">${dm(h[0].date)}</text><text class="ch-t" x="${W-pr}" y="${H-6}" text-anchor="end">${dm(h[h.length-1].date)}</text>`;
  const dots=pts.map((p,i)=>i===pts.length-1?`<circle class="${isPr?'ch-pr':'ch-end'}" cx="${p[0]}" cy="${p[1]}" r="6"/>`:`<circle class="ch-dot" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="מגמת התקדמות">${g}<path class="ch-area" d="${area}" opacity=".7"/><path class="ch-line" d="${line}"/>${dots}</svg>`;
}
V.prog=()=>{
  const t=T(ui.cur);if(!t){ui.view='roster';return V.roster();}
  const ss=sessionsOf(t.id);
  const ids=[];ss.forEach(s=>{const x=entryOf(s,t.id);x.ex.concat(Object.keys(x.log)).forEach(k=>{if((x.log[k]||[]).length&&!ids.includes(k))ids.push(k);});});
  const totalSets=ss.reduce((a,s)=>a+Object.values(entryOf(s,t.id).log).reduce((b,l)=>b+l.length,0),0);
  const cards=ids.map(eid=>{
    const h=history(t.id,eid);const m=Math.max(...h.map(p=>p.w))>0?'w':'r';const unit=m==='w'?'ק״ג':'חזרות';
    const first=h[0][m],last=h[h.length-1][m],best=Math.max(...h.map(p=>p[m]));const d=last-first;
    const pill=h.length<2?`<span class="pill">אימון ראשון</span>`:d>0?`<span class="pill up"><span dir="ltr">+${fmt(d)}</span> ${unit}</span>`:d<0?`<span class="pill down"><span dir="ltr">${fmt(d)}</span> ${unit}</span>`:`<span class="pill">יציב</span>`;

}
function setsFrom(o,rf){

  if(Array.isArray(o.sets)&&o.sets.length&&o.sets.every(s=>s&&typeof s==='object')){
    const out=o.sets.map(s=>({w:numv(pickK(s,WK)),r:numv(pickK(s,RK)),n:nt(s)})).filter(s=>!isNaN(s.w)||!isNaN(s.r));
    return out.length?out.map(s=>({w:isNaN(s.w)?0:s.w,r:isNaN(s.r)?(rf||0):Math.round(s.r),n:s.n})):null;
  }
  const arr=Array.isArray(o.weights)?o.weights:(Array.isArray(o.sets)?o.sets:null);
  if(arr&&arr.length&&arr.every(v=>v==null||typeof v==='number'||typeof v==='string')){
    const out=arr.map(numv).filter(v=>!isNaN(v));return out.length?out.map(w=>({w,r:rf||0})):null;
  }
  if(o.sets==null){const w=numv(pickK(o,WK)),r=numv(pickK(o,RK));if(!isNaN(w)&&(!isNaN(r)||RK.some(k=>k in o)))return [{w,r:isNaN(r)?(rf||0):Math.round(r),n:nt(o)}];}

function walkImp(node,ctx,key,out,depth){
  if(depth>14||node==null||typeof node!=='object')return;
  if(Array.isArray(node)){node.forEach(v=>walkImp(v,ctx,key,out,depth+1));return;}

  const pv=pickK(node,PK);if(typeof pv==='string'&&pv.trim())c.trainee=(c.names&&typeof c.names[pv]==='string')?c.names[pv]:pv.trim();
  const ev=pickK(node,EXK);if(typeof ev==='string'&&ev.trim())c.ex=ev.trim();
  if(node.reps!=null&&!Array.isArray(node.reps)){const r=numv(node.reps);if(!isNaN(r))c.reps=Math.round(r);}

      const nt=typeof node.notes==='string'?node.notes.trim():(typeof node.note==='string'?node.note.trim():'');if(nt)m.notes=nt;

}

    const en=id=>{const e=d.exercises.find(x=>x.id===id);return e?e.name:null;};
    d.trainees.forEach(t=>{out.meta[t.name]={notes:t.notes||'',plan:(t.plan||[]).map(en).filter(Boolean).map(n=>({n}))};});
    d.sessions.forEach(s=>(s.ts||[]).forEach(x=>Object.keys(x.log||{}).forEach(eid=>{const l=x.log[eid];if(l&&l.length&&tn(x.tid)&&en(eid))out.push({trainee:tn(x.tid),ex:en(eid),date:s.date,sets:l.map(z=>({w:+z.w||0,r:+z.r||0,n:z.n}))});})));

function mergeImport(recs,fallback){

  const tBy=n=>{n=n.trim();let t=db.trainees.find(x=>x.name.trim()===n);if(!t){t={id:uid(),name:n};db.trainees.push(t);st.t++;}return t;};
  const eBy=(n,g)=>{const m=EXMAP[n];const hn=m?m[0]:n;let e=db.exercises.find(x=>x.name.trim()===hn);
    if(!e){e={id:'u'+uid(),name:hn,g:m?m[1]:(GMAP[String(g||'').toLowerCase()]||'אחר')};db.exercises.push(e);st.e++;}return e;};

    if(!s){s={id:uid(),date:new Date(new Date(r.date).setHours(12,0,0,0)).getTime(),imported:true,ts:[]};db.sessions.push(s);st.s++;}
    let x=s.ts.find(z=>z.tid===t.id);if(!x){x={tid:t.id,ex:[],log:{}};s.ts.push(x);}
    const fk=s.id+'|'+t.id+'|'+e.id;

    x.log[e.id]=(x.log[e.id]||[]).concat(r.sets.map(z=>z.n?{w:z.w,r:z.r,n:z.n}:{w:z.w,r:z.r}));fresh.add(fk);

  });

}

    <p class="muted">מ-<span class="num">${new Date(im.from).toLocaleDateString('he-IL')}</span> עד <span class="num">${new Date(im.to).toLocaleDateString('he-IL')}</span></p>
    <div>${Object.keys(im.tr).filter(k=>k).sort((a,b)=>im.tr[b]-im.tr[a]).map(k=>`<div class="impt"><span class="grow">${esc(k)}${db.trainees.some(t=>t.name.trim()===k)?' <span class="muted small">· קיים</span>':''}</span><span class="muted"><span class="num">${im.tr[k]}</span> רישומים</span></div>`).join('')}</div>
    ${im.unnamed?`<label for="impName"><b>של איזה מתאמן הקובץ הזה?</b> <span class="muted">(<span class="num">${im.unnamed}</span> סטים בלי שם מתאמן)</span></label><input id="impName" class="inp" list="impNames" placeholder="שם המתאמן" autocomplete="off"><datalist id="impNames">${names}</datalist>`:''}
    <p class="muted small">שמות התרגילים באנגלית יומרו לשמות במאגר העברי. הערות המאמן והתוכנית הקבועה של כל מתאמן יישמרו.</p><button class="btn pri big wide" data-a="impGo">ייבוא ${Object.keys(im.tr).filter(k=>k).length} מתאמנים · ${im.sets} רישומים</button>
  </section>`:''}

};

async function openSeed(code){
  if(!(window.crypto&&crypto.subtle))throw new Error('nosubtle');
  const b64=x=>Uint8Array.from(atob(x),ch=>ch.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SEED_ENC.salt),iterations:SEED_ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(SEED_ENC.iv)},key,b64(SEED_ENC.ct));}catch(e){throw new Error('badcode');}
  return JSON.parse(new TextDecoder().decode(pt));
}
function seedErr(e){return e.message==='badcode'?'הקוד לא נכון. בדקו שהוקלד בדיוק כמו שקיבלתם.':e.message==='nosubtle'?'הדפדפן לא מאפשר פתיחת נתונים מוצפנים בכתובת הזו. פתחו את האפליקציה מהקישור של GitHub (https).':'הטעינה נכשלה. נסו שוב.';}
V.unlock=()=>`<div class="wrap narrow">${top('ברוכים הבאים')}
  <section class="panel"><h2>טעינת נתוני הסטודיו</h2>
    <p class="muted">האפליקציה כוללת את כל הנתונים מהאפליקציה הקודמת: <span class="num">${SEED_ENC.n}</span> מתאמנים, ההיסטוריה שלהם, התוכניות הקבועות והערות המאמן. הם מוצפנים, כדי שלא יהיו גלויים למי שנכנס לקישור. מזינים את קוד הנתונים פעם אחת, ומאז הכול שמור בטאבלט.</p>
    <input id="seedCode" class="inp" style="min-height:72px;font-size:28px;text-align:center;letter-spacing:.15em" placeholder="קוד הנתונים" autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr">

  </section></div>`;

/* keypad */
function openKp(f){kp={f,val:''};renderKp();}
function closeKp(){kp=null;kpEl.hidden=true;kpEl.innerHTML='';}
function renderKp(){
  if(!kp)return;kpEl.hidden=false;
  const keys=['1','2','3','4','5','6','7','8','9',kp.f==='w'?'.':'','0','⌫'];
  kpEl.innerHTML=`<div class="kpbox" role="dialog" aria-modal="true"><div class="kpl">${kp.f==='w'?'משקל בק״ג':'מספר חזרות'}</div><div class="kpv num" dir="ltr">${kp.val?esc(kp.val):'<span class="ph">0</span>'}</div><div class="kpg">${keys.map(k=>k?`<button data-k="${k}">${k}</button>`:'<span></span>').join('')}</div><div class="kpa"><button class="btn" data-k="x">ביטול</button><button class="btn pri" data-k="ok">אישור</button></div></div>`;
}
kpEl.addEventListener('click',e=>{
  if(e.target===kpEl){closeKp();return;}
  const b=e.target.closest('[data-k]');if(!b||!kp)return;const k=b.dataset.k;
  if(k==='x'){closeKp();return;}
  if(k==='ok'){const v=parseFloat(kp.val);if(!isNaN(v)){const x=db.active.ts.find(z=>z.tid===ui.cur);const d=draft(x,ui.open);d[kp.f]=kp.f==='r'?Math.round(v):Math.round(v*100)/100;}closeKp();render();return;}
  if(k==='⌫')kp.val=kp.val.slice(0,-1);
  else if(k==='.'){if(!kp.val.includes('.'))kp.val=(kp.val||'0')+'.';}
  else if(kp.val.length<6)kp.val=(kp.val==='0'?'':kp.val)+k;
  renderKp();
});

  enter(tid){ui.cur=tid;ui.open=null;go('entry');const p=document.querySelector('.swp.on');if(p)try{p.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}},

  step(v){const[f,s]=v.split('|');const x=db.active.ts.find(z=>z.tid===ui.cur);const d=draft(x,ui.open);d[f]=Math.max(0,Math.round((d[f]+(+s)*(f==='w'?2.5:1))*100)/100);render();},

    const hist=history(x.tid,eid);const best=hist.length?Math.max(...hist.map(p=>p.w)):0;const todayMax=l.length?Math.max(...l.map(s=>s.w)):0;
    l.push({w:d.w,r:d.r});delete ui.draft[dkey(x.tid,eid)];save();render();

    else toast('סט '+l.length+' נרשם · '+fmt(d.w)+' × '+d.r);
  },
  delSet(v){const[eid,k]=v.split('|');if(!arm('del:'+eid+':'+k))return;const x=db.active.ts.find(z=>z.tid===ui.cur);x.log[eid].splice(+k,1);delete ui.draft[dkey(x.tid,eid)];save();render();},
  prog(id){ui.cur=id;go('prog');},

  rmEx(id){if(!arm('rmEx:'+id))return;const e=E(id);e.hidden=true;save();render();toast('הוסר מהמאגר. ההיסטוריה נשמרת');},
  copyExp(){const ta=document.getElementById('exp');const done=()=>toast('הגיבוי הועתק');

  dlExp(){try{const b=new Blob([JSON.stringify(db)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');const d=new Date();a.href=u;a.download='community-backup-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){toast('ההורדה נכשלה. השתמשו בהעתקה');}},
  imp(){const txt=document.getElementById('imp').value.trim();if(!txt){toast('הדביקו קודם את טקסט הגיבוי');return;}

  async seedLoad(){

function loadDemo(){
  const people=[['נועה (דוגמה)',1],['איתי (דוגמה)',1.4],['מיכל (דוגמה)',.85]];
  const ids=people.map(([n])=>{const t={id:uid(),name:n,demo:true};db.trainees.push(t);return t.id;});
  const byName=n=>db.exercises.find(e=>e.name===n).id;
  const plan=[['סקוואט אחורי',40],['לחיצת חזה במוט',30],['חתירה במשקולת ביד אחת',12],['דדליפט רומני',35],['הרחקה לצדדים',5]].map(([n,w])=>[byName(n),w]);
  const r=(w,step)=>Math.max(step,Math.round(w/step)*step);
  for(let k=8;k>=1;k--){
    const s={id:uid(),date:Date.now()-k*7*864e5,demo:true,ts:[]};
    ids.forEach((tid,ti)=>{const mult=people[ti][1];const log={};
      plan.forEach(([eid,w0],pi)=>{const step=w0>=15?2.5:1;const grow=1+0.045*(8-k)-((k+pi+ti)%3===0?0.03:0);
        const w=r(w0*mult*grow,step);log[eid]=[{w,r:10},{w,r:10},{w:r(w+step,step),r:8}];});
      s.ts.push({tid,ex:plan.map(p=>p[0]),log});});
    db.sessions.push(s);
  }
  save();
}

if(db.active)ui.view='live';
